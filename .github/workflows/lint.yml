name: linter

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci

      - name: Detect Changed PHP Files
        id: changed-php
        uses: tj-actions/changed-files@v45
        with:
          files: |
            *.php
            app/**/*.php
            bootstrap/**/*.php
            config/**/*.php
            database/**/*.php
            routes/**/*.php
            tests/**/*.php

      - name: Detect Changed Prettier Files
        id: changed-prettier
        uses: tj-actions/changed-files@v45
        with:
          files: |
            resources/**/*.css
            resources/**/*.js
            resources/**/*.ts
            resources/**/*.vue

      - name: Detect Changed ESLint Files
        id: changed-eslint
        uses: tj-actions/changed-files@v45
        with:
          files: |
            resources/**/*.js
            resources/**/*.ts
            resources/**/*.vue

      - name: Run Pint
        if: steps.changed-php.outputs.any_changed == 'true'
        run: vendor/bin/pint --test ${{ steps.changed-php.outputs.all_changed_files }}

      - name: Check Frontend Formatting
        if: steps.changed-prettier.outputs.any_changed == 'true'
        run: npx prettier --check ${{ steps.changed-prettier.outputs.all_changed_files }}

      - name: Lint Frontend
        if: steps.changed-eslint.outputs.any_changed == 'true'
        run: npx eslint ${{ steps.changed-eslint.outputs.all_changed_files }}
